name: Publish Comfy Registry package

on:
  workflow_dispatch:
    inputs:
      version:
        description: New Registry version (must match the intended release)
        required: true
        type: string
      changelog:
        description: Changelog shown in Comfy Registry
        required: true
        type: string
      backend_release_tag:
        description: GitHub Release containing all six platform packages and Kitchen wheels
        required: true
        default: comfyui-v0.1.5
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
      BACKEND_RELEASE_TAG: ${{ inputs.backend_release_tag }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publishing tools
        run: python -m pip install comfy-cli==1.22.0 ruff==0.17.0

      - name: Verify publishing sources
        run: |
          python -m py_compile tools/build_comfyui_package.py comfyui/install.py
          ruff check --select E702 \
            h3_sparse_attention/landmark_v2_cosine_fast.py \
            h3_sparse_attention/landmark_v2_cosine_triton.py \
            h3_sparse_attention/reblock_hierarchy.py

      - name: Confirm backend release archives exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$BACKEND_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > "$RUNNER_TEMP/backend-assets.txt"
          for platform in linux-x86_64 windows-x86_64; do
            for architecture in sm86 sm89 sm120; do
              grep -E -- "-${platform}-${architecture}-cu130\\.zip$" \
                "$RUNNER_TEMP/backend-assets.txt"
            done
          done

      - name: Build Registry package
        run: |
          python tools/build_comfyui_package.py \
            --registry \
            --version "$PACKAGE_VERSION" \
            --backend-release-tag "$BACKEND_RELEASE_TAG" \
            --publisher-id zechengtang \
            --output-dir dist/registry

      - name: Verify Registry package
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib
          import zipfile

          version = os.environ["PACKAGE_VERSION"]
          package = Path("dist/registry/ComfyUI-Spark-H3")
          metadata = tomllib.loads((package / "pyproject.toml").read_text())
          identity = json.loads((package / "spark_h3_build.json").read_text())
          assert metadata["project"]["name"] == "comfyui-spark-h3"
          assert metadata["project"]["version"] == version
          assert metadata["tool"]["comfy"]["PublisherId"] == "zechengtang"
          assert identity["distribution"] == "registry"
          assert identity["backend_source"] == "github-release"
          assert identity["backend_release_tag"] == os.environ["BACKEND_RELEASE_TAG"]
          assert identity["architectures"] == ["sm120", "sm86", "sm89"]
          assert identity["platforms"] == ["linux-x86_64", "windows-x86_64"]
          assert identity["kernel_wheels"] == []
          assert not (package / "wheelhouse").exists()
          assert len(list((package / "workflows").glob("*.json"))) == 15
          archive = Path(f"dist/registry/ComfyUI-Spark-H3-{version}-registry.zip")
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
              assert "pyproject.toml" in bundle.namelist()
          PY
          sha256sum "dist/registry/ComfyUI-Spark-H3-${PACKAGE_VERSION}-registry.zip"

      - name: Prepare tracked package contents for comfy-cli
        working-directory: dist/registry/ComfyUI-Spark-H3
        run: |
          git init
          git config user.name "Spark-H3 Registry Publisher"
          git config user.email "noreply@users.noreply.github.com"
          git add --force .
          git commit -m "Prepare Comfy Registry package ${PACKAGE_VERSION}"

      - name: Validate Registry metadata and contents
        working-directory: dist/registry/ComfyUI-Spark-H3
        run: comfy node validate

      - name: Save production candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: spark-h3-registry-${{ inputs.version }}-candidate
          path: dist/registry/ComfyUI-Spark-H3-${{ inputs.version }}-registry.zip
          retention-days: 14

      - name: Confirm Registry version is unused
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          url = "https://api.comfy.org/nodes/comfyui-spark-h3/versions"
          with urllib.request.urlopen(url, timeout=30) as response:
              versions = json.load(response)
          version = os.environ["PACKAGE_VERSION"]
          if any(item.get("version") == version for item in versions):
              raise RuntimeError(f"Registry version {version} already exists")
          PY

      - name: Publish Registry package
        working-directory: dist/registry/ComfyUI-Spark-H3
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          COMFY_NODE_CHANGELOG: ${{ inputs.changelog }}
        run: comfy node publish --token "$REGISTRY_ACCESS_TOKEN"

      - name: Check Registry version record after publish attempt
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          url = "https://api.comfy.org/nodes/comfyui-spark-h3/versions"
          with urllib.request.urlopen(url, timeout=30) as response:
              versions = json.load(response)
          matching = [item for item in versions if item.get("version") == os.environ["PACKAGE_VERSION"]]
          print(json.dumps(matching, indent=2))
          PY
